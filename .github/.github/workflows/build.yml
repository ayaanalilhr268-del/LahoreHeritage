name: Build Lahore Heritage APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Create Android project
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/lahoreheritage/app

          cp "Lahore Heritage – App Prototype (1).html" app/src/main/assets/index.html
          cp "lahore-heritage-logo-square.png" app/src/main/assets/logo.png

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Lahore Heritage"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name="com.lahoreheritage.app.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/lahoreheritage/app/MainActivity.java <<'EOF'
          package com.lahoreheritage.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");

                  setContentView(webView);
              }
          }
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LahoreHeritage"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.lahoreheritage.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.lahoreheritage.app'
                  minSdk 23
                  targetSdk 28
                  versionCode 2
                  versionName '1.1'
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/assets/index.html")
          html = p.read_text(encoding="utf-8")

          # Make the header use the logo bundled beside index.html.
          html = re.sub(
              r'(<header\b[^>]*>.*?<img\b[^>]*\bsrc\s*=\s*)["\'][^"\']*["\']',
              r'\1"logo.png"',
              html,
              count=1,
              flags=re.IGNORECASE | re.DOTALL
          )

          # Fallback: override the first header image after the page loads.
          script = """
          <script>
          document.addEventListener('DOMContentLoaded', function () {
            var logo = document.querySelector('header img');
            if (logo) {
              logo.src = 'logo.png';
              logo.alt = 'Lahore Heritage logo';
            }
          });
          </script>
          """
          if "</body>" in html.lower():
              match = re.search(r"</body>", html, re.IGNORECASE)
              html = html[:match.start()] + script + html[match.start():]
          else:
              html += script

          p.write_text(html, encoding="utf-8")
          PY

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lahore-Heritage-apk
          path: app/build/outputs/apk/debug/app-debug.apk